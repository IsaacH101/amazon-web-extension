<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      font-family: Arial, sans-serif;
      padding: 12px;
      background-color: #f7f7f7;
    }
    h3 {
      font-size: 14px;
      margin-top: 0;
      color: #111;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #FF9900;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #e88b00;
    }
    #result {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>Amazon Scraper</h3>
  <button id="scrapeBtn">Scrape Page</button>
  <div id="result"></div>

  <script src="popup.js"></script>
</script></body>
</html>
